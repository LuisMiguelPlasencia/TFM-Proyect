[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "real-estate-forecasting-spain"
version = "0.1.0"
description = "Real Estate Market Forecasting in Spanish Cities with Big Data: Application of Machine Learning Algorithms and Time Series Models"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "TFM Project", email = "project@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core data science stack
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    
    # Visualization
    "plotly>=5.17.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    
    # Machine Learning
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    
    # Time Series
    "statsmodels>=0.14.0",
    "prophet>=1.1.4",
    "pmdarima>=2.0.0",
    
    # Jupyter and notebooks
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
    
    # Data validation and profiling
    "ydata-profiling>=4.6.0",
    "great-expectations>=0.18.0",
    "pydantic>=2.0.0",
    
    # MLOps and experiment tracking
    "mlflow>=2.8.0",
    "dvc>=3.32.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
