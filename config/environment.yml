name: real-estate-forecasting
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python>=3.11
  - pip>=23.0

  # Core data science
  - numpy>=1.24.0
  - pandas>=2.0.0
  - polars>=0.20.0
  - pyarrow>=14.0.0
  
  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly>=5.17.0
  - ipywidgets>=8.0.0
  
  # Machine Learning
  - scikit-learn>=1.3.0
  - xgboost>=2.0.0
  - lightgbm>=4.0.0
  - catboost>=1.2.0
  
  # Time Series
  - statsmodels>=0.14.0
  - prophet>=1.1.4
  - pmdarima>=2.0.0
  
  # Jupyter and notebooks
  - jupyter>=1.0.0
  - jupyterlab>=4.0.0
  
  # MLOps
  - mlflow>=2.8.0
  - dvc>=3.32.0
  
  # Development tools
  - black>=23.9.0
  - isort>=5.12.0
  - flake8>=6.1.0
  - pytest>=7.4.0
  
  # Utilities
  - tqdm>=4.66.0
  - loguru>=0.7.0
  
  # Additional dependencies via pip
  - pip:
    - ydata-profiling>=4.6.0
    - great-expectations>=0.18.0
    - pydantic>=2.0.0
    - python-dotenv>=1.0.0
    - rich>=13.0.0 